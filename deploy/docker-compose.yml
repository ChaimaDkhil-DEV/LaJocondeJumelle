# Production sur un VPS (depuis la racine du dépôt) :
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: ljj

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    # Aucun port publié : joignable uniquement par Caddy sur le réseau interne.
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@db:5432/${POSTGRES_DB:-app}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET manquant}
      APP_ORIGIN: https://${DOMAIN}
      FILES_DIR: /data/files
      # Adresse IP cliente transmise par Caddy (réseau Docker privé).
      TRUST_PROXY: uniquelocal
      # Une migration en attente n'est appliquée qu'avec une sauvegarde plus récente (deploy/deploy.sh).
      PRE_MIGRATION_BACKUP_MAX_AGE_MINUTES: ${PRE_MIGRATION_BACKUP_MAX_AGE_MINUTES:-60}
      # Fuseau de l'école (jours et heures locales des affectations), identifiant IANA.
      SCHOOL_TIMEZONE: ${SCHOOL_TIMEZONE:-${TZ:-Europe/Paris}}
      # Assistance aux demandes (specs 009 et 010) : désactivée par défaut ; valeurs vides = défauts
      # de l'API. `demo` est refusé en production ; `rules` n'utilise aucun service externe.
      ASSIST_SUGGESTION_PROVIDER: ${ASSIST_SUGGESTION_PROVIDER:-disabled}
      ASSIST_TRANSCRIPTION_PROVIDER: ${ASSIST_TRANSCRIPTION_PROVIDER:-disabled}
      ASSIST_TIMEOUT_MS: ${ASSIST_TIMEOUT_MS:-}
      ASSIST_TRANSCRIPTION_TIMEOUT_MS: ${ASSIST_TRANSCRIPTION_TIMEOUT_MS:-}
      ASSIST_RATE_LIMIT: ${ASSIST_RATE_LIMIT:-}
      # Transcription locale : relais HTTPS interne de Caddy (port 8444 non publié) et certificat de
      # son autorité interne, lu à chaque appel dans le volume de Caddy (monté en lecture seule).
      ASSIST_WHISPER_URL: ${ASSIST_WHISPER_URL:-https://caddy:8444}
      ASSIST_WHISPER_MODEL: ${ASSIST_WHISPER_MODEL:-}
      ASSIST_WHISPER_API_KEY: ${ASSIST_WHISPER_API_KEY:-}
      ASSIST_WHISPER_CA_FILE: ${ASSIST_WHISPER_CA_FILE:-/caddy-data/caddy/pki/authorities/local/root.crt}
      # Connecteur Claude (service payant, décision de l'établissement requise) : clé jamais commitée.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSIST_CLAUDE_MODEL: ${ASSIST_CLAUDE_MODEL:-}
      # Notifications push (spec 014) : les trois ou aucune ; vides = push désactivé. Clé privée jamais commitée.
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
      # Communication avec les parents (spec 015) : notifications externes par n8n, désactivées si vides.
      # Adresse interne (réseau Docker) : l'événement ne passe jamais par Internet. Secret jamais commité.
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET:-}
      N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS:-}
      PARENT_COMM_CHANNELS: ${PARENT_COMM_CHANNELS:-}
    volumes:
      # Vocaux, photos et documents : jamais servis par Caddy, lus uniquement via l'API.
      - files:/data/files
      # Certificat racine de l'autorité interne de Caddy (relais HTTPS vers Whisper), lecture seule.
      - caddy_data:/caddy-data:ro
      # Lecture seule : l'API vérifie la présence d'une sauvegarde récente avant de migrer.
      - ${BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      db:
        condition: service_healthy

  # Transcription locale (spec 010, research R5 et R11) : serveur Whisper compatible OpenAI, sans
  # service payant ; l'audio ne quitte pas le serveur. Désactivé par défaut, démarré avec le profil :
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile whisper up -d
  # Aucun port publié : l'API le joint en HTTPS par Caddy (https://caddy:8444).
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    profiles: ['whisper']
    restart: unless-stopped
    expose:
      - '8000'
    volumes:
      # Modèles téléchargés (Hugging Face), conservés entre deux redémarrages.
      - whisper_models:/home/ubuntu/.cache/huggingface/hub

  # Automatisation n8n (spec 015) : notifications externes des communications approuvées (e-mail,
  # WhatsApp Business Platform). Désactivée par défaut, démarrée avec le profil :
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile n8n up -d
  # (ou COMPOSE_PROFILES=n8n dans deploy/.env). Sa panne n'arrête jamais l'application : l'API garde
  # les événements (outbox) et les renvoie. Base PostgreSQL dédiée, aucun port publié ; l'éditeur
  # est servi par Caddy sur N8N_DOMAIN (HTTPS), aux seules adresses N8N_ALLOWED_IPS.
  n8n:
    image: n8nio/n8n:2.44.7@sha256:942bc274709f27f99f7c6024a785d8e8f75ac06838cabcba448abb8d9127ec7b
    profiles: ['n8n']
    restart: unless-stopped
    init: true
    # Refus de démarrer sans clé de chiffrement explicite (identifiants SMTP et WhatsApp chiffrés
    # avec elle) ni secret partagé : une clé générée en silence serait perdue avec le volume.
    entrypoint:
      - /bin/sh
      - -c
      - '[ "$${#N8N_ENCRYPTION_KEY}" -ge 32 ] || { echo "[n8n] N8N_ENCRYPTION_KEY manquante ou trop courte (32 caractères minimum)" >&2; exit 1; }; [ "$${#LJJ_SHARED_SECRET}" -ge 32 ] || { echo "[n8n] N8N_SHARED_SECRET manquant ou trop court (32 caractères minimum)" >&2; exit 1; }; exec /docker-entrypoint.sh'
    expose:
      - '5678'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_HOST: ${N8N_DOMAIN:-n8n.localhost}
      N8N_PORT: '5678'
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN:-n8n.localhost}/
      WEBHOOK_URL: https://${N8N_DOMAIN:-n8n.localhost}/
      N8N_PROXY_HOPS: '1'
      N8N_SECURE_COOKIE: 'true'
      GENERIC_TIMEZONE: ${TZ:-Europe/Paris}
      TZ: ${TZ:-Europe/Paris}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_RUNNERS_ENABLED: 'true'
      # Aucune donnée envoyée à l'éditeur de n8n ; pas de modèles ni d'annonces de version.
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      # Données personnelles (adresses, numéros) : exécutions réussies non conservées, erreurs 14 jours.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '336'
      # Workflow « LJJ — Notification des communications aux parents » (deploy/n8n) : vérification de
      # la signature (module crypto, secret lu dans l'environnement), appels à l'API interne.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      LJJ_API_URL: http://api:3000
      LJJ_SHARED_SECRET: ${N8N_SHARED_SECRET:-}
      LJJ_MAIL_FROM: ${N8N_MAIL_FROM:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-fr}
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow à importer (lecture seule) : voir docs/parent-communications.md.
      - ./n8n:/workflows:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    depends_on:
      n8n-db:
        condition: service_healthy

  # Base dédiée à n8n : séparée de celle de l'application (aucun accès croisé).
  n8n-db:
    image: postgres:17
    profiles: ['n8n']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${N8N_POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${N8N_POSTGRES_DB:-n8n}
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  # Sauvegarde quotidienne de n8n (base + dossier /home/node/.n8n), mêmes scripts et même rotation
  # que l'application, dans le sous-dossier n8n de BACKUP_DIR (et de BACKUP_OFFSITE_DIR).
  n8n-backup:
    image: postgres:17
    profiles: ['n8n']
    restart: unless-stopped
    environment:
      PGHOST: n8n-db
      PGUSER: ${N8N_POSTGRES_USER:-n8n}
      PGPASSWORD: ${N8N_POSTGRES_PASSWORD:-}
      PGDATABASE: ${N8N_POSTGRES_DB:-n8n}
      BACKUP_TIME: ${N8N_BACKUP_TIME:-02:45}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      OFFSITE_ENABLED: ${BACKUP_OFFSITE_DIR:+1}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - n8n_data:/data/files:ro
      - ${BACKUP_DIR:-./backups}/n8n:/backups
      - ./backup:/scripts:ro
      - ${BACKUP_OFFSITE_DIR:-./backups}/n8n:/offsite
    entrypoint: ['/bin/bash', '/scripts/run-nightly.sh']
    healthcheck:
      test: ['CMD-SHELL', 'test -n "$$(find /backups -maxdepth 1 -name "db-*.dump" -mmin -1560 -print -quit)"']
      interval: 5m
      timeout: 10s
      start_period: 1m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    depends_on:
      n8n-db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    # Aucun port publié.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  # Sauvegarde quotidienne : pg_dump compressé + archive des fichiers, rotation 14 jours.
  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      PGDATABASE: ${POSTGRES_DB:-app}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Non vide seulement si BACKUP_OFFSITE_DIR est défini.
      OFFSITE_ENABLED: ${BACKUP_OFFSITE_DIR:+1}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      # Lecture seule : la sauvegarde lit les fichiers sans pouvoir les modifier.
      - files:/data/files:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./backup:/scripts:ro
      # Copie hors du VPS (sans BACKUP_OFFSITE_DIR : dossier local, aucune copie effectuée).
      - ${BACKUP_OFFSITE_DIR:-./backups}:/offsite
    entrypoint: ['/bin/bash', '/scripts/run-nightly.sh']
    # « unhealthy » si aucune sauvegarde de la base n'a réussi depuis 26 h (docker compose ps).
    # L'alerte vers l'extérieur vient de deploy/backup/check-backup.sh (tâche cron de l'hôte).
    healthcheck:
      test: ['CMD-SHELL', 'test -n "$$(find /backups -maxdepth 1 -name "db-*.dump" -mmin -1560 -print -quit)"']
      interval: 5m
      timeout: 10s
      start_period: 1m
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
  whisper_models:
  n8n_data:
  n8n_pgdata:

# Tests de bout en bout, un profil par machine : chacun a sa base et ses comptes jetables, la suite complète dure donc
# le temps du profil le plus long. Lancement à la main (onglet Actions, ou `gh workflow run E2E --ref <branche>`) : la
# suite ne bloque aucune fusion (docs/procedure-fusion.md). Elle se lance aussi quand ce fichier change, pour l'essayer.
name: E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/e2e.yml

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Un profil en échec n'arrête pas les autres : le bilan doit être complet.
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: iPhone 13, browser: webkit }
          - { project: iPhone 17 Pro Max, browser: webkit }
          - { project: Pixel 7, browser: chromium }
          - { project: mobile-320, browser: chromium }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Paquets apt (ffmpeg, bibliothèques du navigateur) gardés en cache, comme dans ci.yml : le miroir est parfois très
      # lent (trois tâches sur quatorze arrêtées avant tout test, le 2026-11-24). Par navigateur, à défaut ceux de ci.yml ;
      # changer -v1 pour le vider. Clé par tâche, sauvegardée même après un échec : la suivante reprend où elle s'est arrêtée.
      - name: Restaurer les paquets apt
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-ffmpeg
          key: apt-e2e-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          restore-keys: |
            apt-e2e-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-v1-
            apt-ffmpeg-${{ runner.os }}-${{ runner.arch }}-v1-

      - name: Installer ffmpeg (conversion des vocaux)
        id: apt
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-ffmpeg/partial
          echo "before=$(ls ~/apt-ffmpeg/*.deb 2>/dev/null | sort | md5sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'Dir::Cache::Archives "%s";
APT::Keep-Downloaded-Packages "true";
' "$HOME/apt-ffmpeg" | sudo tee /etc/apt/apt.conf.d/80e2e
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npm run -w backend prisma:generate

      - name: Installer le navigateur
        timeout-minutes: 20
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Préparer le cache des paquets apt
        id: apt-after
        if: ${{ always() && steps.apt.outputs.before != '' }}
        run: |
          sudo rm -rf ~/apt-ffmpeg/partial ~/apt-ffmpeg/lock
          sudo chown -R "$USER" ~/apt-ffmpeg
          [ "$(ls ~/apt-ffmpeg/*.deb 2>/dev/null | sort | md5sum | cut -d' ' -f1)" = "${{ steps.apt.outputs.before }}" ] || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sauvegarder les paquets apt
        if: ${{ always() && steps.apt-after.outputs.changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/apt-ffmpeg
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      # Sans nouvel essai, comme en local : un échec intermittent doit se voir.
      - name: Tests de bout en bout
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: npx playwright test -c e2e/playwright.config.ts --project="$PLAYWRIGHT_PROJECT" --retries=0

      - name: Conserver le rapport
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.project }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

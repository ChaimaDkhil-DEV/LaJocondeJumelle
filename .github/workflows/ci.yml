# Contrôles qualité rejoués à chaque envoi et à chaque demande de fusion (décision D3).
# Les tests de bout en bout et le chronométrage SC-001 restent manuels (docs/validation/).
# La fusion n'est pas bloquée techniquement : voir docs/procedure-fusion.md (décision D10).
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Contrôles qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Paquets .deb de ffmpeg (environ 94 Mo) gardés en cache : le miroir apt d'Azure est souvent
      # lent (plus de 10 min le 2026-10-23, demandes #28 et #31). Avec le cache, apt ne télécharge
      # que les paquets absents ou mis à jour depuis ; changer le suffixe -v1 pour le vider.
      - name: Cache des paquets ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/apt-ffmpeg
          key: apt-ffmpeg-${{ runner.os }}-${{ runner.arch }}-v1

      # Plafond : l'installation par apt a déjà bloqué plus de 20 min (2026-10-22, deux fois) ; échec
      # rapide au lieu du délai de 6 h par défaut, puis relance manuelle (gh run rerun).
      - name: Installer ffmpeg (conversion des vocaux)
        timeout-minutes: 10
        run: |
          mkdir -p ~/apt-ffmpeg/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-ffmpeg" \
            -o APT::Keep-Downloaded-Packages=true ffmpeg
          sudo chown -R "$USER" ~/apt-ffmpeg
          ffmpeg -version | head -1 && ffprobe -version | head -1

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npm run -w backend prisma:generate

      - name: Lint
        run: npm run lint

      - name: Types (backend)
        run: npm run -w backend typecheck

      - name: Types (frontend)
        run: npm run -w frontend typecheck

      - name: Tests unitaires (backend)
        run: npm run -w backend test

      - name: Tests d'intégration (backend)
        run: npm run -w backend test:integration

      - name: Tests (frontend)
        run: npm run -w frontend test

      - name: Audit des dépendances
        run: npm audit --audit-level=high
